<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tote Finder</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #000; }
  #container { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  /* MindAR appends the video's wrapper AFTER the canvas in the DOM,
     which by default paints it on top and hides everything the
     canvas draws (labels, debug box, etc). Force the correct order. */
  #container canvas { z-index: 2 !important; }
  #container > div { z-index: 1 !important; }
  #status {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: rgba(0,0,0,0.65); color: #fff; font: 14px/1.4 -apple-system, system-ui, sans-serif;
    padding: 8px 12px; text-align: center;
  }
  #status.ok { background: rgba(20,120,20,0.65); }
  #status.err { background: rgba(160,20,20,0.75); }
  #ar-overlay {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    z-index: 9999; pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="ar-overlay"></canvas>

<div id="container"></div>
<div id="status">Loading camera…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { MindARThree } from "mindar-image-three";
/* ============================================================
   CONFIG — fill these in before running
   ============================================================ */
const CONFIG = {
  // Path to the .mind file you compile from the 4 marker PNGs
  // (see the "compiling your markers" step in the README)
  targetFile: "./targets.mind",

  // How many markers are in that .mind file, in compile order.
  // The prototype set is tote_01.png .. tote_04.png -> IDs 1-4.
  toteIds: [1, 2, 3, 4],

  // Google Sheet setup:
  //   - Sheet shared as "Anyone with the link can view"
  //   - Row 1 = headers, e.g.: ToteID | Contents
  //   - API key restricted to the Sheets API + your hosting domain
  sheetId: "1ezihzjsOJU_58w5Xmvtqr1hJjRiQKiw_8LZbUCjFDW8",
  sheetRange: "A2:B31",
  apiKey: "AIzaSyD183-RFGtvj0xJ2aGsvCbE98uYEce9fCo",

  // How often to re-pull the sheet while the app is open (ms)
  refreshMs: 30000,

  // Label sizing — this is the "clamped scale" behavior:
  // label stays this many world-units tall regardless of distance,
  // but never renders smaller/larger than the min/max screen size.
  labelWidth: 0.85,     // world units (roughly matches marker width)
  labelHeight: 0.32,
  minPixelScale: 0.55,  // don't shrink past this even far away
  maxPixelScale: 1.3,   // don't grow past this up close
};

/* ============================================================
   STATE
   ============================================================ */
const statusEl = document.getElementById("status");
function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

let toteData = {}; // { "1": "hoses, gloves, spare filters", ... }
const labelMeshes = {}; // toteId -> THREE.Mesh
const anchorRefs = {};  // toteId -> mindar anchor object
const visibleTotes = new Set();

/* ============================================================
   GOOGLE SHEETS LOOKUP
   ============================================================ */
async function refreshSheetData() {
  const { sheetId, sheetRange, apiKey } = CONFIG;
  if (sheetId.startsWith("PASTE_") || apiKey.startsWith("PASTE_")) {
    setStatus("Add your Sheet ID + API key in CONFIG (top of index.html)", "err");
    return;
  }
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${encodeURIComponent(sheetRange)}?key=${apiKey}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Sheets API ${res.status}`);
    const data = await res.json();
    const rows = data.values || [];
    const updated = {};
    for (const row of rows) {
      const [id, contents] = row;
      if (!id) continue;
      const match = String(id).match(/(\d+)/);
      if (!match) continue;
      const numericId = parseInt(match[1], 10); // "Tote 01" -> 1
      updated[numericId] = contents || "(no contents listed)";
    }
    toteData = updated;
    // refresh any labels currently showing
    for (const toteId of visibleTotes) updateLabelText(toteId);
  } catch (err) {
    console.error("Sheet fetch failed:", err);
    setStatus("Couldn't reach the Google Sheet — check API key / sharing settings", "err");
  }
}

/* ============================================================
   LABEL TEXTURE (canvas-drawn text -> texture on a plane)
   ============================================================ */
function makeLabelCanvas(title, body) {
  const canvas = document.createElement("canvas");
  canvas.width = 640; canvas.height = 240;
  const ctx = canvas.getContext("2d");

  // card background
  ctx.fillStyle = "rgba(255,255,255,0.95)";
  roundRect(ctx, 4, 4, canvas.width - 8, canvas.height - 8, 24);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.85)";
  ctx.lineWidth = 6;
  roundRect(ctx, 4, 4, canvas.width - 8, canvas.height - 8, 24);
  ctx.stroke();

  ctx.fillStyle = "#111";
  ctx.font = "bold 40px -apple-system, system-ui, sans-serif";
  ctx.fillText(title, 28, 56);

  ctx.font = "28px -apple-system, system-ui, sans-serif";
  wrapText(ctx, body, 28, 104, canvas.width - 56, 34);

  return canvas;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = String(text).split(" ");
  let line = "";
  let lines = 0;
  for (const word of words) {
    const test = line + word + " ";
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, y + lines * lineHeight);
      line = word + " ";
      lines++;
      if (lines >= 4) { ctx.fillText(line.trim() + "…", x, y + lines * lineHeight); return; }
    } else {
      line = test;
    }
  }
  ctx.fillText(line, x, y + lines * lineHeight);
}

function updateLabelText(toteId) {
  const mesh = labelMeshes[toteId];
  if (!mesh) return;
  const contents = toteData[toteId] || "(not in sheet yet)";
  const canvas = makeLabelCanvas(`Tote ${toteId}`, contents);
  mesh.material.map.dispose();
  mesh.material.map = new THREE.CanvasTexture(canvas);
  mesh.material.needsUpdate = true;
}

/* ============================================================
   AR SETUP
   ============================================================ */
async function start() {
  const mindarThree = new MindARThree({
    container: document.querySelector("#container"),
    imageTargetSrc: CONFIG.targetFile,
    maxTrack: 1, // TEMPORARY: testing with only 1 simultaneous target to isolate the false-detection issue
    filterMinCF: 0.001,    // higher = more smoothing on jitter (was 0.0001)
    filterBeta: 100,       // lower = less twitchy response to fast movement (was 1000)
    warmupTolerance: 10,   // require ~10 consistent frames before declaring "found"
    missTolerance: 10,     // allow ~10 missed frames before declaring "lost" (less flicker)
  });

  const { scene, camera } = mindarThree;

  // Render into OUR OWN canvas (#ar-overlay) instead of MindAR's internal
  // one — something about the internal canvas wasn't actually visible
  // on screen despite correct z-index/stacking, so we sidestep it
  // entirely with a canvas we fully control.
  const arCanvas = document.getElementById("ar-overlay");
  const renderer = new THREE.WebGLRenderer({ canvas: arCanvas, alpha: true, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  function resizeOverlay() {
    renderer.setSize(window.innerWidth, window.innerHeight, false);
  }
  resizeOverlay();
  window.addEventListener("resize", resizeOverlay);

  // TEMPORARY: fully opaque magenta clear, to prove this canvas
  // is visible at all, independent of any object position math.
  renderer.setClearColor(0x000000, 0);

  // Soft light so canvas textures render true-color
  scene.add(new THREE.AmbientLight(0xffffff, 1.0));

  CONFIG.toteIds.forEach((toteId, index) => {
    const anchor = mindarThree.addAnchor(index);
    anchorRefs[toteId] = anchor;

    // Parent the label to the anchor group, like MindAR expects — this
    // is what makes position/scale come out correct automatically.
    // Each frame, we still cancel out the anchor's rotation so the
    // label faces the camera flat (billboard) instead of tilting with
    // the tote, without fighting the coordinate system.
    const canvas = makeLabelCanvas(`Tote ${toteId}`, "loading…");
    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
    const geometry = new THREE.PlaneGeometry(CONFIG.labelWidth, CONFIG.labelHeight);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.visible = false;
    mesh.position.set(0, 0.75, 0); // sits just above the marker, in the anchor's local space
    labelMeshes[toteId] = mesh;
    anchor.group.add(mesh);

    anchor.onTargetFound = () => {
      visibleTotes.add(toteId);
      mesh.visible = true;
      updateLabelText(toteId);
      setStatus(`Tracking ${visibleTotes.size} tote(s)`, "ok");
    };
    anchor.onTargetLost = () => {
      visibleTotes.delete(toteId);
      mesh.visible = false;
      setStatus(visibleTotes.size ? `Tracking ${visibleTotes.size} tote(s)` : "Point camera at a tote marker");
    };
  });

  console.log("DIAG: calling mindarThree.start()...");
  await mindarThree.start();
  console.log("DIAG: mindarThree.start() resolved OK");
  setStatus("Point camera at a tote marker");
  refreshSheetData();
  setInterval(refreshSheetData, CONFIG.refreshMs);

  const camWorldQuat = new THREE.Quaternion();
  const anchorWorldQuat = new THREE.Quaternion();
  let diagFrameLogged = false;

  renderer.setAnimationLoop(() => {
    if (!diagFrameLogged) {
      diagFrameLogged = true;
      console.log("DIAG: render loop is running, first frame fired");
    }
    camera.updateWorldMatrix(true, false);
    camera.getWorldQuaternion(camWorldQuat);

    for (const toteId of CONFIG.toteIds) {
      const anchor = anchorRefs[toteId];
      const mesh = labelMeshes[toteId];
      if (!mesh.visible) continue;

      // billboard: cancel out the anchor's own rotation, then apply the
      // camera's, so the label ends up facing the camera flat instead
      // of tilting with the tote — while position/scale still come
      // from the normal parent-child transform (correct units).
      anchor.group.getWorldQuaternion(anchorWorldQuat);
      mesh.quaternion.copy(anchorWorldQuat.clone().invert().multiply(camWorldQuat));
    }

    renderer.render(scene, camera);
  });
}

start().catch(err => {
  console.error(err);
  setStatus("Camera/AR failed to start — check console + camera permissions", "err");
});
</script>
</body>
</html>
